<meta property="og:type" content="website">

<!-- Depois de publicar, troque ENDERECO-DO-SITE pelo endereço real para a foto aparecer quando o link for compartilhado -->
<meta property="og:image" content="https://ENDERECO-DO-SITE/img/capa.jpg">
<link rel="icon" type="image/png" href="img/icone.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
<header class="marca gutter">
  <img src="img/logo.webp" alt="Encantos" width="476" height="257">
  <p>Joias para usar todo dia e para os dias especiais</p>
</header>

<div class="filtros gutter">
  <div class="wrap">
    <div class="chips" id="chips" role="group" aria-label="Categorias"></div>
    <label class="busca"><span hidden>Buscar peça</span><input id="busca" type="search" placeholder="Buscar peça pelo nome ou código"></label>
  </div>
</div>

<main class="gutter">
  <div class="wrap"><div id="vitrine"></div></div>
</main>

<footer class="gutter">
  <div class="wrap">
    <h2>Gostou de alguma peça?</h2>
    <p>Chame no WhatsApp com o código da peça e receba valores, tamanhos e disponibilidade.</p>
    <div class="numero" id="numero">(65) 99679-9714</div>
    <div class="acoes">
      <a href="https://wa.me/5565996799714?text=Ol%C3%A1!%20Vi%20o%20cat%C3%A1logo%20da%20Encantos%20e%20gostaria%20de%20ver%20as%20pe%C3%A7as." target="_blank" rel="noopener">Abrir WhatsApp</a>
      <button id="copiar" type="button">Copiar número</button>
    </div>
  </div>
</footer>

<script src="app.js"></script>
